# Serves the Vite production build (frontend/dist) as a single-page app.
# Baked into infra/docker/frontend.Dockerfile's `production` stage via COPY
# — kept inside frontend/ (not infra/docker/nginx/) so that Dockerfile's
# build context stays scoped to this directory only, matching
# backend.Dockerfile/telegram.Dockerfile's existing convention: neither of
# those ever COPYs anything from outside its own service directory (see
# each Dockerfile's `context:` in infra/docker-compose.yml/.prod.yml).
#
# Unrelated to the edge/TLS-terminating Nginx described in
# HRMS_Architecture.md sections 8/9 ("Nginx (TLS, rate limit)" in front of
# the backend) — that is a separate, not-yet-built component. This config
# only serves this one container's own static files, nothing else.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets — Vite's build output is already
    # content-hashed/immutable, so aggressive compression has no
    # correctness downside.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets (dist/assets/*) are safe to cache forever — a new
    # deploy ships new filenames, it never mutates an existing one.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (React Router) — any path that isn't a real file
    # falls back to index.html, so deep links (e.g. /employees/123) work on
    # a hard refresh instead of 404ing at the web server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached — it's what points the
    # browser at the current build's hashed asset filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
