# Production stack. Postgres and Redis are included here as containers
# because that was explicitly requested for this phase; a real production
# deployment would more typically point `DATABASE_URL`/`REDIS_*_URL` at
# managed services (e.g. RDS, ElastiCache, or equivalent) rather than
# co-locating stateful containers with the application — worth revisiting
# once actual deployment infrastructure is chosen.
name: united-hrms

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
      # Explicit, not incidental: backend.Dockerfile also defines a `local`
      # stage (test/lint tooling) after this one for infra/docker-compose.yml's
      # use. Pinning `production` here means a future reordering of those
      # stages can never accidentally ship pytest/black/ruff into this image.
      target: production
    image: united-hrms-backend:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    image: united-hrms-backend:latest
    restart: unless-stopped
    command: celery -A config worker --loglevel=info -Q default
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    image: united-hrms-backend:latest
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Telegram Gateway (Phase 7) -----------------------------------------
  # Deliberately has no `depends_on: db` and never will — see
  # telegram_gateway/requirements.txt's docstring; this container has no
  # Postgres driver installed at all, so a violation would fail to import.

  telegram_gateway_redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  telegram_gateway:
    build:
      context: ../telegram_gateway
      dockerfile: ../infra/docker/telegram.Dockerfile
    image: united-hrms-telegram-gateway:latest
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
      telegram_gateway_redis:
        condition: service_healthy

volumes:
  postgres_data:
